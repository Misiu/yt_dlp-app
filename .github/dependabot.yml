version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    groups:
      yt-dlp:
        patterns: ["yt-dlp*"]
      python-runtime:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp*"]
  - package-ecosystem: npm
    directory: /youtube_audio_downloader/rootfs/app/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        versions: ["7.0.x"]
  - package-ecosystem: docker
    directory: /youtube_audio_downloader
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
